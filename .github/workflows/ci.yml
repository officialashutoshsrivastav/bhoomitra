name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bhoomitra
          POSTGRES_PASSWORD: bhoomitra_dev_password
          POSTGRES_DB: bhoomitra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bhoomitra" --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Enable extensions
        run: |
          PGPASSWORD=bhoomitra_dev_password psql -h localhost -U bhoomitra -d bhoomitra_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bhoomitra:bhoomitra_dev_password@localhost:5432/bhoomitra_test
          JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package.json}
      - run: npm install
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
